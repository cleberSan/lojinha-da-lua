version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      astro:
        patterns: ["astro", "@astrojs/*"]
      testes:
        patterns: ["vitest", "@vitest/*", "@playwright/test", "@axe-core/*"]
      lint:
        patterns: ["eslint", "eslint-*", "typescript-eslint", "prettier", "prettier-*"]
      fontes:
        patterns: ["@fontsource/*"]
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
